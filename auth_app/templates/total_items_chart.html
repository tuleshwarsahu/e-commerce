<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sales Chart</title>
    <style>
        /* Some basic styling */
        .chart-container {
            text-align: center;
            margin-top: 20px;
        }
        .download-btn {
            background-color: #4CAF50;
            color: white;
            padding: 10px 20px;
            text-decoration: none;
            border-radius: 5px;
            margin-top: 20px;
        }
        .download-btn:hover {
            background-color: #45a049;
        }
    </style>
</head>
<body>

    <h1>Total Items Sold in Each Category (Monthly)</h1>

    {% if error %}
        <p>{{ error }}</p>
    {% else %}
        <div class="chart-container">
            <img src="{{ graph_url }}" alt="Sales Chart" id="sales-chart">
            
            <!-- Download Button -->
            <a href="{{ graph_url }}" download="sales_chart.png" class="download-btn">Download Chart</a>
        </div>
    {% endif %}

</body>
</html>
