<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Details</title>
    <style>
        /* General Reset */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            line-height: 1.6;
            padding: 2rem;
        }

        .product-detail {
            max-width: 800px;
            margin: 0 auto;
            border: 1px solid #ddd;
            border-radius: 5px;
            padding: 1.5rem;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
            display: flex;
            gap: 2rem;
            flex-wrap: wrap;
        }

        .product-detail img {
            width: 100%;
            max-width: 300px;
            border-radius: 5px;
            object-fit: cover;
        }

        .product-info {
            flex: 1;
        }

        .product-title {
            font-size: 2rem;
            margin-bottom: 0.5rem;
        }

        .product-price {
            font-size: 1.5rem;
            color: #28a745;
            margin-bottom: 1rem;
        }

        .product-description {
            font-size: 1rem;
            color: #555;
            margin-bottom: 1rem;
        }

        .product-category {
            font-size: 1rem;
            margin-bottom: 1rem;
            color: #007bff;
        }

        .product-status {
            font-size: 1rem;
            margin-bottom: 1rem;
        }

        .sale-status {
            display: inline-block;
            padding: 0.3rem 0.5rem;
            border-radius: 5px;
            color: white;
        }

        .sale-status.green {
            background-color: green;
        }

        .sale-status.red {
            background-color: red;
        }

        .back-link {
            display: inline-block;
            margin-top: 1rem;
            padding: 0.5rem 1rem;
            background-color: #333;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            transition: background-color 0.3s;
        }

        .back-link:hover {
            background-color: #555;
        }
    </style>
</head>
<body>
    <div class="product-detail">
        <img src="{{ product.image_url }}" alt="{{ product.title }}">
        <div class="product-info">
            <h1 class="product-title">{{ product.title }}</h1>
            <p class="product-price">${{ product.price }}</p>
            <p class="product-description">{{ product.description }}</p>
            <p class="product-category">Category: {{ product.category }}</p>
            <p class="product-status">Sold: {{ product.sold|yesno:"Yes,No" }}</p>
            <span class="sale-status {% if product.is_sale %}green{% else %}red{% endif %}">
                {% if product.is_sale %}On Sale{% else %}Regular Price{% endif %}
            </span>
        </div>
    </div>
    <a href="/" class="back-link">Back to Products</a>
</body>
</html>
